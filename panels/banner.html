<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gametimewes · Twitch Banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="../ds/styles.css">
<style>
  /* Twitch profile banner: 1200×480. Twitch crops top/bottom on wide screens,
     so everything that matters sits in the middle band (y ≈ 130–350). */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0d0c0c; }
  #banner { position: relative; width: 1200px; height: 480px; overflow: hidden; background: #0d0c0c; color: var(--color-bg); font-family: "Archivo", system-ui, sans-serif; }
  /* Rossoneri stripe field on the right, fading into black */
  .field { position: absolute; top: 0; bottom: 0; right: 0; width: 560px;
    background: repeating-linear-gradient(90deg, var(--color-accent) 0 56px, #0d0c0c 56px 112px); }
  .field::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #0d0c0c 0%, rgba(13,12,12,.85) 22%, rgba(13,12,12,0) 60%); }
  .stripe { position: absolute; left: 0; right: 0; height: 14px; background: repeating-linear-gradient(90deg, var(--color-accent) 0 30px, #0d0c0c 30px 60px); }
  .stripe.top { top: 0; } .stripe.bottom { bottom: 0; }
  .band { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); padding: 0 64px; display: flex; align-items: center; justify-content: space-between; }
  .left { display: flex; flex-direction: column; gap: 14px; }
  .kicker { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 600; letter-spacing: .16em; color: var(--color-accent-400); }
  .kicker i { width: 16px; height: 16px; background: var(--color-accent); display: inline-block; }
  .name { font-size: 100px; font-weight: 800; line-height: .86; letter-spacing: -.045em; text-transform: uppercase; }
  .rule { height: 4px; width: 640px; background: var(--color-bg); }
  .tags { display: flex; gap: 0; }
  .tags span { font-size: 18px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 9px 14px; background: var(--color-text); border-right: 2px solid #0d0c0c; }
  .tags span:first-child { background: var(--color-accent); color: #fff; }
  .card { position: relative; background: #0d0c0c; border-top: 8px solid var(--color-accent); padding: 18px 22px 20px; display: flex; flex-direction: column; gap: 6px; min-width: 250px; }
  .card .k { font-size: 14px; font-weight: 600; letter-spacing: .16em; color: var(--color-neutral-400); }
  .card .v { font-size: 26px; font-weight: 800; letter-spacing: -.01em; line-height: 1; }
  .card .s { font-size: 15px; font-weight: 600; color: var(--color-neutral-300); letter-spacing: .04em; }
  .card + .card { margin-top: 0; }
  .stack { display: flex; flex-direction: column; gap: 10px; width: 300px; }
  .card .v { white-space: nowrap; }
</style>
</head>
<body>
<div id="banner">
  <div class="field"></div>
  <div class="stripe top"></div><div class="stripe bottom"></div>
  <div class="band">
    <div class="left">
      <div class="kicker"><i></i>LIVE ON TWITCH · FORZA MILAN</div>
      <div class="name">Gametimewes</div>
      <div class="rule"></div>
      <div class="tags"><span>Milan watchalongs</span><span>EA FC Pro Clubs</span><span>MSFS 2024</span></div>
    </div>
    <div class="stack">
      <div class="card"><div class="k">TIKTOK · IG · YOUTUBE</div><div class="v">@gametimewes</div></div>
    </div>
  </div>
</div>
</body>
</html>
