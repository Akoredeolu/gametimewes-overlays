<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gametimewes · Watchalong Overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
  :root{ --c1:#0d0c0c; --c2:#ec3013; --ink:#201e1d; --line:#2d2b2b; --txt:#f3f2f2; --sub:#bab6b6; --homeC:#f3f2f2; --awayC:#ec3013;
    --stripe:repeating-linear-gradient(90deg,#ec3013 0 30px,#0d0c0c 30px 60px); }
  body.neutral{ --stripe:#ec3013; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;
    font-family:'Archivo',system-ui,sans-serif;color:var(--txt)}
  @keyframes drift{to{background-position:60px 0}}
  body:not(.neutral):not(.still) .scorebug::before,body:not(.neutral):not(.still) .slipcard::before,body:not(.neutral):not(.still) .cam::before{animation:drift 3s linear infinite}
  #panel{position:fixed;top:0;left:0;right:0;z-index:100;background:#161413;border-bottom:2px solid #f3f2f2;
    padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:end;color:#f3f2f2;font-size:13px}
  #panel.hidden{display:none}
  #panel .f{display:flex;flex-direction:column;gap:4px}
  #panel label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#ff9783}
  #panel input,#panel select,#panel textarea{background:#0d0c0c!important;border:2px solid #444141!important;color:#f3f2f2!important;border-radius:0!important;padding:7px 9px;font:inherit}
  #panel input:focus-visible,#panel select:focus-visible,#panel textarea:focus-visible{outline:2px solid #ec3013;outline-offset:2px}
  #panel button{cursor:pointer;border:2px solid #ec3013;border-radius:0;padding:8px 14px;font:inherit;font-weight:800;color:#fff;background:#ec3013;text-align:left}
  #panel button:hover{background:#ff4d2e}
  #panel button.sec{background:transparent;border-color:#f3f2f2}
  #panel button.sec:hover{background:#201e1d}
  #panel .url{flex-basis:100%;font-size:11px;color:#bab6b6;word-break:break-all}
  #panel .url code{color:#ff9783}
  #scaler{position:fixed;inset:0;overflow:hidden;pointer-events:none}
  #stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left}
  .scorebug{position:absolute;left:50%;top:28px;transform:translateX(-50%);
    display:flex;align-items:stretch;min-width:780px;background:var(--c1);padding-top:12px}
  .scorebug::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:var(--stripe)}
  .comp{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;padding:14px 20px;
    background:var(--ink);color:var(--txt);min-width:124px}
  .comp img{height:38px}
  .comp small{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
  .side{display:flex;align-items:center;gap:14px;padding:0 24px;flex:1}
  .side.home{justify-content:flex-end} .side.away{justify-content:flex-start}
  .tname{font-weight:800;font-size:30px;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap}
  .tlogo{width:54px;height:54px;object-fit:contain}
  .score{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 22px;min-width:168px;background:var(--c2);white-space:nowrap}
  .score .nums{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1;white-space:nowrap;color:#fff}
  .clock{margin-top:6px;font-size:15px;font-weight:800;letter-spacing:.1em;color:#fff;display:flex;align-items:center;gap:8px}
  .clock .dot{width:10px;height:10px;background:#fff;animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}
  .brand{position:absolute;left:50%;top:176px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
    font-size:16px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--txt);
    background:var(--ink);padding:10px 20px}
  .brand .live{color:var(--c2);font-weight:800;display:flex;align-items:center;gap:8px}
  .brand .live::before{content:"";width:12px;height:12px;background:var(--c2);animation:blink 1.6s infinite}
  .lineup{position:absolute;top:150px;width:430px;display:flex;flex-direction:column;gap:0}
  .lineup.home{left:30px} .lineup.away{right:30px}
  .lu-head{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--c2);color:#fff}
  .lineup.away .lu-head{flex-direction:row-reverse;text-align:right;background:var(--ink);color:var(--txt);border-top:6px solid var(--c2)}
  .lu-head img{width:44px;height:44px;object-fit:contain}
  .lu-head .nm{font-size:22px;font-weight:800;line-height:1.1;text-transform:uppercase;letter-spacing:-.01em}
  .lu-head .fm{font-size:13px;font-weight:600;letter-spacing:.12em;opacity:.85}
  .lu-list{display:flex;flex-direction:column;gap:0}
  .pl{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--c1);border-bottom:2px solid var(--line)}
  .lineup.away .pl{flex-direction:row-reverse;text-align:right}
  .pl .num{font-size:18px;font-weight:800;color:var(--c2);min-width:30px;font-variant-numeric:tabular-nums}
  .lineup.away .pl .num{text-align:right}
  .pl .pn{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl .ps{font-size:11px;font-weight:600;color:var(--sub);letter-spacing:.12em;margin-left:auto}
  .lineup.away .pl .ps{margin-left:0;margin-right:auto}
  .lineup.away .pl .pn{flex:1}
  .lu-empty{padding:16px;background:var(--c1);font-size:18px;font-weight:800;color:var(--sub)}
  .bench-title{margin-top:12px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff;
    padding:6px 12px;background:var(--c2);align-self:flex-start}
  .lineup.away .bench-title{align-self:flex-end}
  .bench{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .lineup.away .bench{justify-content:flex-end}
  .sub{display:flex;align-items:center;gap:6px;padding:5px 9px;background:var(--c1);font-size:13px;font-weight:600}
  .sub .sn{color:var(--c2);font-weight:800;font-variant-numeric:tabular-nums}
  #bottomstack{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;
    align-items:center;gap:14px;max-width:1840px}
  .events{display:flex;flex-direction:column;align-items:flex-start;gap:0}
  .ev-title{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--c2);padding:6px 14px}
  .ev-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-start}
  .ev{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--c1);border-top:6px solid var(--line);animation:slideUp .4s ease}
  .ev.ev-home{border-top-color:var(--homeC)}
  .ev.ev-away{border-top-color:var(--awayC)}
  .ev .elogo{width:26px;height:26px;object-fit:contain}
  .ev .ico{font-size:13px;font-weight:800;letter-spacing:.08em;padding:4px 8px;background:var(--ink);color:var(--txt);min-width:52px;text-align:center}
  .ev .ico.goal{background:var(--c2);color:#fff}
  .ev .ico.yc{background:#f3f2f2;color:#0d0c0c}
  .ev .ico.rc{background:var(--c2);color:#fff}
  .ev .t{font-weight:800;color:var(--txt);font-size:20px;font-variant-numeric:tabular-nums;min-width:44px}
  .ev .d b{font-weight:800;font-size:19px;display:block;white-space:nowrap}
  .ev .d small{color:var(--sub);font-size:13px;font-weight:600}
  @keyframes slideUp{from{transform:translateY(26px);opacity:0}to{transform:translateY(0);opacity:1}}
  .slips{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:center;max-width:1820px;pointer-events:auto}
  .slipcard{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:10px;background:var(--c1);padding:22px 16px 14px}
  .slipcard::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--stripe)}
  .slip-head{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#ff9783}
  .slip-legs{display:flex;gap:6px;flex-wrap:wrap;max-width:880px}
  .leg{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;background:var(--ink);border:2px solid #444141;font-size:15px;font-weight:800;transition:.15s}
  .leg:hover{border-color:var(--c2)}
  .leg .st{font-size:13px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:2px solid #7d7979;line-height:1}
  .leg .od{color:#ff9783;font-weight:800;font-variant-numeric:tabular-nums}
  .leg.won{background:#f3f2f2;color:#0d0c0c;border-color:#f3f2f2}
  .leg.won .st{border-color:#0d0c0c} .leg.won .od{color:#ae1800}
  .leg.lost{opacity:.45}
  .leg.lost .tx{text-decoration:line-through} .leg.lost .st{border-color:var(--c2);color:var(--c2)}
  .slip-foot{font-size:15px;font-weight:800;display:flex;gap:14px;align-items:center;border-top:2px solid var(--line);padding-top:10px;letter-spacing:.02em}
  .slip-foot .cashed{background:#f3f2f2;color:#0d0c0c;padding:2px 10px} .slip-foot .busted{background:var(--c2);color:#fff;padding:2px 10px} .slip-foot .ret{color:#ff9783}
  #goalBanner{position:absolute;left:50%;top:300px;transform:translate(-50%,-50%) translateX(-40px);opacity:0;
    font-size:132px;font-weight:800;letter-spacing:-.045em;line-height:.9;color:#fff;text-transform:uppercase;
    background:var(--c2);padding:28px 40px 26px;border-top:14px solid #0d0c0c;
    transition:.45s cubic-bezier(.2,.8,.2,1);z-index:40}
  #goalBanner.show{opacity:1;transform:translate(-50%,-50%)}
  #goalBanner small{display:block;font-size:28px;letter-spacing:.06em;color:#fff;margin-top:14px;font-weight:800}
  .msg{position:fixed;bottom:14px;left:14px;z-index:90;font-size:12px;color:#bab6b6;background:#0d0c0c;padding:6px 12px}
  .msg.hidden{display:none}
  img[src=""],img:not([src]){display:none}

  #cams{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;gap:40px;pointer-events:none;z-index:5}
  .cam{width:600px;aspect-ratio:16/9;border:6px solid var(--c1);border-top-width:18px;position:relative;background:transparent}
  .cam::before{content:"";position:absolute;left:-6px;right:-6px;top:-18px;height:12px;background:var(--stripe)}
  .cam .plate{position:absolute;left:-6px;bottom:-46px;white-space:nowrap;background:var(--c1);color:var(--txt);
    font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:20px;padding:8px 18px 8px 14px;display:flex;align-items:center;gap:12px}
  .cam .plate::before{content:"";width:14px;height:14px;background:var(--c2)}

  /* ---------- vertical 1080x1920 (?layout=vertical) ---------- */
  body.vertical #stage{width:1080px;height:1920px}
  body.vertical .scorebug{top:180px;min-width:0;width:1032px}
  body.vertical .comp{min-width:96px;padding:12px 14px} body.vertical .comp small{display:none}
  body.vertical .side{padding:0 14px;gap:10px} body.vertical .tname{font-size:24px} body.vertical .tlogo{width:42px;height:42px}
  body.vertical .score{min-width:150px;padding:12px 16px} body.vertical .score .nums{font-size:46px}
  body.vertical .brand{top:318px}
  body.vertical .lineup{top:390px;width:504px} body.vertical .lineup.home{left:24px} body.vertical .lineup.away{right:24px}
  body.vertical .lu-head .nm{font-size:18px} body.vertical .lu-head img{width:34px;height:34px}
  body.vertical .pl{padding:6px 10px;gap:8px} body.vertical .pl .pn{font-size:16px} body.vertical .pl .num{font-size:15px;min-width:24px} body.vertical .pl .ps{display:none}
  body.vertical .sub{font-size:12px;padding:4px 7px}
  body.vertical #bottomstack{bottom:440px;max-width:1032px;width:1032px}
  body.vertical .slips{max-width:1032px} body.vertical .slip-legs{max-width:1000px}
  body.vertical .ev-row{flex-direction:column;gap:4px} body.vertical .ev{width:1032px}
  body.vertical #goalBanner{top:960px;font-size:120px}
  body.vertical #cams{top:390px;transform:translateX(-50%);gap:24px}
  body.vertical .cam{width:500px} body.vertical .cam .plate{font-size:16px}
  body.vertical.has-cams .lineup{display:none}
</style>

<div id="panel">
  <div class="f"><label>API key</label><input id="key" type="password" style="width:200px"></div>
  <div class="f"><label>Competition theme</label>
    <select id="theme">
      <option value="PL">Premier League</option>
      <option value="UCL">Champions League</option>
      <option value="UEL">Europa League</option>
      <option value="UECL">Conference League</option>
      <option value="SA">Serie A</option>
      <option value="LL">La Liga</option>
      <option value="BL">Bundesliga</option>
      <option value="WC">World Cup</option>
      <option value="GEN">Generic (brand colors)</option>
    </select>
  </div>
  <div class="f"><label>Find fixture</label><select id="liveList"><option value="">— search —</option></select></div>
  <div class="f"><label>or Fixture ID</label><input id="fixtureId" type="number" placeholder="e.g. 1035000" style="width:120px"></div>
  <div class="f"><label>Style</label><select id="mode"><option value="milan">Rossoneri (Milan)</option><option value="neutral">Neutral</option></select></div>
  <div class="f"><label>Handle</label><input id="handle" value="Gametimewes" style="width:130px"></div>
  <div class="f"><label>Custom logo (file/URL)</label><input id="badge" placeholder="e.g. wc-logo.png" style="width:170px"></div>
  <div class="f"><label>Lineups</label><select id="showLineups"><option value="1">Show</option><option value="0">Hide</option></select></div>
  <div class="f"><label>Cam 1 (left) name</label><input id="host" value="Gametimewes" style="width:140px"></div>
  <div class="f"><label>Cam 2 (right) name</label><input id="guest" value="Guest" style="width:140px"></div>
  <div class="f"><label>Cam frames</label><select id="showCams"><option value="1">Show</option><option value="0">Hide</option></select></div>
  <button id="findLive" class="sec">Search live</button>
  <button id="start">Start overlay</button>
  <button id="hide" class="sec">Hide panel (OBS)</button>
  <div class="f" style="flex-basis:100%"><label>Bet slips — one leg per line, add "@ odds". Start a new slip with "# Name | stake"</label>
    <textarea id="slipText" rows="6" placeholder="# Acca 1 | 10&#10;Man City win @ 1.70&#10;Both teams to score @ 1.95&#10;# Banker | 25&#10;Over 1.5 goals @ 1.30" style="background:#1b2236;border:1px solid #2a3450;color:#e8edf7;border-radius:8px;padding:7px 9px;font:inherit;width:100%;resize:vertical"></textarea></div>
  <div class="f"><label>Default stake</label><input id="slipStake" type="number" step="0.01" placeholder="10" style="width:90px"></div>
  <div class="f"><label>Currency</label><input id="slipCur" value="$" style="width:60px"></div>
  <div class="url" id="urlOut"></div>
</div>

<div id="scaler">
  <div id="stage">
    <div id="goalBanner"></div>
  </div>
</div>
<div class="msg" id="msg">Overlay idle — set a fixture and press Start.</div>

  const s=Math.min(window.innerWidth/SW, window.innerHeight/SH);

  if(a.length===slips.length) slips.forEach((s,si)=>{ if(a[si]&&a[si].length===s.legs.length) s.legs.forEach((l,li)=>l.status=a[si][li]); });
}catch(e){} }

function parseSlips(text,dStake){
  const out=[]; let cur=null;
  text.split('\n').forEach(line=>{
    const t=line.trim();
    if(t.startsWith('#')){ const body=t.slice(1).trim(); const p=body.split('|');
      cur={name:p[0].trim(), stake:p.length>1?(parseFloat(p[1])||dStake):dStake, legs:[]}; out.push(cur); return; }
    if(!t) return;
    let odds=null,desc=t; const m=t.match(/@\s*([\d.]+)\s*$/); if(m){odds=parseFloat(m[1]); desc=t.slice(0,m.index).trim();}
    if(!cur){ cur={name:'',stake:dStake,legs:[]}; out.push(cur); }
    cur.legs.push({text:desc,odds,status:'pending'});
  });
  return out.filter(s=>s.legs.length);
}
function slipsToText(){
  return slips.map((s,i)=>{
    const head=(slips.length>1||s.name)?`# ${s.name||('Slip '+(i+1))}${s.stake?' | '+s.stake:''}\n`:'';
    return head+s.legs.map(l=>l.text+(l.odds?' @ '+l.odds:'')).join('\n');
  }).join('\n');
}

// ---------- bet slips ----------
const STATUS_ICON={pending:'',won:'✓',lost:'✕'};
function slipCard(s,si){
  const won=s.legs.filter(l=>l.status==='won').length;
  const anyLost=s.legs.some(l=>l.status==='lost');
  const allWon=s.legs.length>0 && s.legs.every(l=>l.status==='won');
  const haveAll=s.legs.every(l=>l.odds);
  const totalOdds=haveAll?s.legs.reduce((p,l)=>p*l.odds,1):null;
  const ret=(totalOdds!=null&&s.stake)?s.stake*totalOdds:null;
  const legsHtml=s.legs.map((l,i)=>`<div class="leg ${l.status}" data-s="${si}" data-i="${i}" title="click to tick">
      <span class="st">${STATUS_ICON[l.status]}</span>
      <span class="tx">${l.text}</span>${l.odds?`<span class="od">${l.odds.toFixed(2)}</span>`:''}
    </div>`).join('');
  let foot;
  if(anyLost) foot=`<span class="busted">BUSTED</span>`;
  else if(allWon) foot=`<span class="cashed">CASHED${ret!=null?` · ${slipCur}${ret.toFixed(2)}`:''}</span>`;
  else foot=`<span>${won}/${s.legs.length} in</span>`
        +(totalOdds!=null?`<span class="ret">@ ${totalOdds.toFixed(2)}</span>`:'')
        +(ret!=null?`<span>${slipCur}${s.stake} → <span class="ret">${slipCur}${ret.toFixed(2)}</span></span>`:'');
  const name=s.name || (slips.length>1?('Slip '+(si+1)):(handle+' Bet Slip'));
  return el(`<div class="slipcard">
      <div class="slip-head">${name}</div>
      <div class="slip-legs">${legsHtml}</div>
      <div class="slip-foot">${foot}</div>
    </div>`);
}
// slips on top, match events beneath — one bottom-anchored stack, no overlap
function renderBottom(){
  const old=$("bottomstack"); if(old)old.remove();
  const hasEvents=lastEvents&&lastEvents.length;
  if(!slips.length && !hasEvents) return;
  const cont=el('<div id="bottomstack"></div>');
  if(slips.length){
    const sc=el('<div class="slips" id="slips"></div>');
    slips.forEach((s,si)=>sc.appendChild(slipCard(s,si)));
    sc.querySelectorAll('.leg').forEach(elm=>elm.addEventListener('click',()=>cycleLeg(parseInt(elm.dataset.s),parseInt(elm.dataset.i))));
    cont.appendChild(sc);
  }
  if(hasEvents){ const ev=eventsHtml(lastEvents,lastFx); if(ev) cont.appendChild(el(ev)); }
  $("stage").appendChild(cont);
}
function cycleLeg(si,i){
  const order=['pending','won','lost'];
  const l=slips[si].legs[i];
  l.status=order[(order.indexOf(l.status)+1)%3];
  saveSlipStatuses();
  renderBottom();
}

// ---------- polling ----------
async function tick(){
  try{
    const fxArr=await api("fixtures",{id:fixtureId});
    if(!fxArr.length){ setMsg("Fixture not found — check the ID."); return; }
    const fx=fxArr[0]; const th=applyTheme(theme);

    // lineups: fetch once, then retry every few ticks until populated (they appear ~40 min pre-KO)
    if(showLineups){
      if(!lineupCache && lineupTries<60){ lineupTries++;
        try{ const lu=await api("fixtures/lineups",{fixture:fixtureId}); if(lu&&lu.length) lineupCache=lu; }catch(e){}
      }
    }
    let events=[];
    try{ events=await api("fixtures/events",{fixture:fixtureId}); }catch(e){}

    // render
    clearStage();
    const frag=document.createElement('div'); frag.innerHTML=scorebugHtml(fx,th);
    [...frag.children].forEach(c=>$("stage").appendChild(c));
    if(showLineups){
      const home=lineupCache?lineupCache[0]:null, away=lineupCache?lineupCache[1]:null;
      $("stage").appendChild(el(lineupHtml(home,'home')));
      $("stage").appendChild(el(lineupHtml(away,'away')));
    }
    lastEvents=events; lastFx=fx;
    renderBottom();
    setMsg(null);

    // new-goal banner
    events.forEach(ev=>{
      const id=`${ev.time.elapsed}-${ev.time.extra||0}-${ev.type}-${ev.detail}-${ev.player&&ev.player.id}`;
      if(!seenEvents.has(id)){ seenEvents.add(id);
        if(lastScore!==null && (ev.type||'').toLowerCase()==='goal') goalBanner(ev);
      }
    });
    lastScore=`${fx.goals.home}-${fx.goals.away}`;

    if(["FT","AET","PEN"].includes(fx.fixture.status.short)){ clearInterval(timer); timer=null; }
  }catch(e){ setMsg("⚠️ "+e.message); }
}
function start(){
  if(!fixtureId)return;
  seenEvents=new Set(); lastScore=null; lineupCache=null; lineupTries=0;
  restoreSlipStatuses();
  applyTheme(theme);
  renderCams();
  if(timer)clearInterval(timer);
  tick(); timer=setInterval(tick,15000);
}

// ---------- boot ----------
applyTheme(theme);
renderCams();
if(qp.get('obs')==='1') $("panel").classList.add("hidden");
if(fixtureId) start();

// ---------- live control from the dashboard (when the URL has no ?fixture=) ----------
window.gtwApplyState=function(st){
  if(qp.get('fixture')||DEMO) return; // explicit URL (or demo) wins
  window.__stateDriven=true;
  const changed=String(st.fixtureId||'')!==String(fixtureId);
  theme=st.theme||theme; mode=st.mode||mode; handle=st.handle||handle; customBadge=st.badge||'';
  showLineups=st.lineups!==false; showCams=!!st.cams; host=st.host||host; guest=st.guest||guest; slipCur=st.cur||slipCur;
  slips=(st.slips||[]).map(s=>({name:s.name||'',stake:s.stake||0,legs:(s.legs||[]).map(l=>({text:l.text,odds:l.odds,status:l.status||'pending'}))}));
  applyMode(); renderCams();
  fixtureId=String(st.fixtureId||'');
  if(!fixtureId){ if(timer){clearInterval(timer);timer=null;} clearStage(); renderBottom(); setMsg(qp.get('obs')==='1'?null:'Waiting for a fixture from the dashboard…'); return; }
  if(changed) start(); else renderBottom();
};
</script>
<script type="module">
import { watch } from '../lib/state.js';
const qp=new URLSearchParams(location.search);
if(!qp.get('fixture') && qp.get('demo')!=='1') watch('watchalong', st=>window.gtwApplyState(st));
</script>
