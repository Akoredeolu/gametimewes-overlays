<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gametimewes Overlays</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="ds/styles.css">
<link rel="stylesheet" href="dashboard/dashboard.css">
<style>
  .hero { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; border-bottom: 2px solid #f3f2f2; padding-bottom: 20px; margin-bottom: 24px; }
  .hero h1 { margin: 0; font-size: clamp(40px, 7vw, 88px); font-weight: 800; line-height: .9; letter-spacing: -.04em; text-transform: uppercase; }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 384px), 1fr)); gap: 24px; }
  body.v .gal { grid-template-columns: repeat(auto-fill, minmax(min(100%, 216px), 1fr)); }
  .tile { display: flex; flex-direction: column; gap: 8px; }
  .tile .k { display: flex; justify-content: space-between; font-weight: 800; text-transform: uppercase; font-size: 14px; }
  .tile .k code { font-weight: 400; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border: 2px solid #444141; background: #0d0c0c; }
  body.v .frame { aspect-ratio: 9 / 16; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  h3 { margin: 32px 0 12px; }
</style>
</head>
<body>
<header class="top"><div class="stripe"></div><div class="bar"><div class="brand"><b>GAMETIMEWES</b><span>Overlay pack · Rossoneri</span></div>
  <nav><button class="on" data-l="h">Horizontal</button><button data-l="v">Vertical</button></nav>
  <div class="who"><a class="btn btn-primary" href="dashboard/">Open dashboard →</a></div></div></header>
<main>
  <div class="hero"><h1>Overlay<br>pack</h1><p class="hint" style="max-width:520px">Every scene below is a live OBS browser source. Grab exact URLs (with the right size) from the dashboard's <b>OBS links</b> tab. Previews show the gameplay/webcam placeholders, which are invisible on air.</p></div>
  <div id="gal"></div>
</main>
<script>
const GROUPS = [
  ['Flight sim', ['f-start', 'f-game', 'f-cockpit', 'f-chat', 'f-brb', 'f-end']],
  ['Pro Clubs', ['c-start', 'c-game', 'c-half', 'c-brb', 'c-end']],
  ['Watchalong', ['w-start', 'w-live', 'w-lineups', 'w-half', 'w-end', 'w-brb', 'w-goal']],
];
function render(l) {
  document.body.classList.toggle('v', l === 'v');
  document.getElementById('gal').innerHTML = GROUPS.map(([g, ids]) => `<h3>${g}</h3><div class="gal">${ids.map(id =>
    `<div class="tile"><div class="k"><span>${id}</span><a href="overlays/scenes.html?scene=${id}&preview=1${l === 'v' ? '&layout=vertical&safe=1' : ''}" target="_blank" rel="noopener"><code>open ↗</code></a></div>
     <div class="frame"><iframe loading="lazy" title="${id}" src="overlays/scenes.html?scene=${id}&preview=1${l === 'v' ? '&layout=vertical' : ''}"></iframe></div></div>`).join('')}</div>`).join('');
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b)); render(b.dataset.l); });
render('h');
</script>
</body>
</html>
